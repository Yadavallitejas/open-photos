# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC -Dfile.encoding=UTF-8 --add-exports=jdk.compiler/com.sun.tools.javac.util=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.file=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.main=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.model=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.processing=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.tree=ALL-UNNAMED --add-exports=jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
android.useAndroidX=true
android.nonFinalResIds=true
kotlin.code.style=official
# Run Kotlin compiler in-process to avoid spawning a separate Kotlin daemon JVM.
# Prevents dual-JVM OOM on machines with limited RAM (Gradle + Kotlin daemons).
kotlin.compiler.execution.strategy=in-process
org.gradle.java.home=C:/Program Files/Android/Android Studio/jbr

