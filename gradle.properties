# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx3072m -XX:+UseParallelGC -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonFinalResIds=true
kotlin.code.style=official
# Run Kotlin compiler in-process to avoid spawning a separate Kotlin daemon JVM.
# Prevents dual-JVM OOM on machines with limited RAM (Gradle + Kotlin daemons).
kotlin.compiler.execution.strategy=in-process
